[package]
name = "xreal"
version = "0.1.0"
edition = "2021"

[dependencies]
winit = { version = "0.30.12", features = ["default", "rwh_05"] }

scap = {git = "https://github.com/CapSoftware/scap"}
pixels = "0.14.0"

dcmimu = "0.2.2"
nalgebra = { version = "0.34.1", default-features = false, features = ["std"] }
